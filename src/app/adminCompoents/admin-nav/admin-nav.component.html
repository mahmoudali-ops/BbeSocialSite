<!-- TOP BAR -->
<header class="admin-topbar">

  <!-- Left -->
  <div class="topbar-left pointer" routerLink="/home">
    <img src="../../../assets/images/bbesocaiallogo.png" alt="Logo" class="topbar-logo">
  </div>

  <!-- Center -->
  <div class="topbar-center">
    <h1>BbeSocial Admin</h1>
  </div>

  <!-- Right -->
  <div class="topbar-right">
    <button class="logout-btn" (click)="onLogout()">
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </button>
  </div>

</header>
