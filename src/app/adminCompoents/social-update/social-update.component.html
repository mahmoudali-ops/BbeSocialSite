<div class="social-update-container">
    <form [formGroup]="socialForm" (ngSubmit)="onSubmit()" class="social-form">
  
      <!-- Facebook -->
      <div class="form-group">
        <label>Facebook URL</label>
        <input type="text" formControlName="facebookUrl">
      </div>
  
      <!-- Instagram -->
      <div class="form-group">
        <label>Instagram URL</label>
        <input type="text" formControlName="instagramUrl">
      </div>
  
      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email">
      </div>
  
      <!-- Current Image -->
      <div *ngIf="currentImage" class="current-image">
        <label>Current Image</label>
        <img [src]="currentImage" alt="Social Image">
      </div>
      
      <!-- New Image Preview -->
      <div *ngIf="newImagePreview" class="image-preview">
        <label>New Image Preview:</label>
        <img [src]="newImagePreview" alt="New Social Image">
        <button type="button" (click)="removeNewImage()">Remove New Image</button>
      </div>
  
      <!-- Upload -->
      <div class="form-group">
        <label>Upload New Image</label>
        <input type="file" #fileInput (change)="onFileSelected($event)">
      </div>
  
      <button type="submit">Update Social Elements</button>
  
    </form>
  </div>
